<div id="architecture-progress-map" role="img" aria-label="Negotiation-agent architecture progress map. Green nodes are implemented, amber nodes are partial, and red nodes are not built.">
  <style>
    #architecture-progress-map { color: var(--foreground); font-family: inherit; }
    #architecture-progress-map .title { margin: 0 0 6px; font-weight: 500; }
    #architecture-progress-map .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 12px; font-size: 12px; color: var(--muted-foreground); }
    #architecture-progress-map .legend span { display: inline-flex; align-items: center; gap: 6px; }
    #architecture-progress-map .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
    #architecture-progress-map .swatch.done { background: var(--green); }
    #architecture-progress-map .swatch.partial { background: var(--orange); }
    #architecture-progress-map .swatch.missing { background: var(--red); }
    #architecture-progress-map svg { display: block; width: 100%; height: auto; overflow: visible; }
    #architecture-progress-map .edge { fill: none; stroke: var(--border); stroke-width: 1.5; marker-end: url(#apm-arrow); }
    #architecture-progress-map .loop { fill: none; stroke: var(--border); stroke-width: 1.5; marker-end: url(#apm-arrow); }
    #architecture-progress-map .node rect { stroke-width: 1.5; rx: 11px; ry: 11px; }
    #architecture-progress-map .node.done rect { fill: color-mix(in srgb, var(--green) 17%, var(--background)); stroke: var(--green); }
    #architecture-progress-map .node.partial rect { fill: color-mix(in srgb, var(--orange) 17%, var(--background)); stroke: var(--orange); }
    #architecture-progress-map .node.missing rect { fill: color-mix(in srgb, var(--red) 14%, var(--background)); stroke: var(--red); }
    #architecture-progress-map .node text { fill: var(--foreground); font-size: 13px; font-weight: 500; text-anchor: middle; }
    #architecture-progress-map .node .small { font-size: 11px; font-weight: 400; fill: var(--muted-foreground); }
    #architecture-progress-map .node .status { font-size: 11px; font-weight: 500; }
    #architecture-progress-map .node.done .status { fill: var(--green); }
    #architecture-progress-map .node.partial .status { fill: var(--orange); }
    #architecture-progress-map .node.missing .status { fill: var(--red); }
    #architecture-progress-map .edge-label { fill: var(--muted-foreground); font-size: 11px; text-anchor: middle; }
    @media (max-width: 560px) {
      #architecture-progress-map .node text { font-size: 11px; }
      #architecture-progress-map .node .small, #architecture-progress-map .node .status, #architecture-progress-map .edge-label { font-size: 9px; }
    }
  </style>

  <h3 class="title">Negotiation architecture — implementation map</h3>

    <span><i class="swatch partial"></i> Partial / not connected</span>
